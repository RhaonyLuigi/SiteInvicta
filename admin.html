<!doctype html><html lang="pt-BR"><head><link rel="icon" href="/assets/app-icon.svg" type="image/svg+xml"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Organizar eventos | Invicta</title><link rel="manifest" href="/manifest.webmanifest"><link rel="stylesheet" href="/styles.css"><link rel="stylesheet" href="/app.css"><script type="module" src="/admin.js"></script></head><body><a class="skip-link" href="#conteudo">Pular para o conteúdo</a><header class="site-header"><div class="wrap topbar"><a class="brand" href="/index.html">Invicta</a><nav aria-label="Principal"><a href="/index.html">Eventos</a><a href="/conta.html">Meus ingressos</a><a href="/admin.html">Organizar</a><a href="/validador.html">Portaria</a></nav></div></header>
<main class="wrap section wide" id="conteudo"><div class="section-heading"><div><p class="eyebrow">Organização</p><h1>Seus eventos</h1></div><a class="button button-secondary" href="/conta.html">Minha conta</a></div><p data-status class="notice" role="status" hidden></p>
<section id="manage" hidden>
<div class="organization-toolbar"><div class="stack"><label for="org-select">Organização</label><select id="org-select"></select></div><form id="org-form" class="input-row"><label for="org-name">Nova organização</label><input id="org-name" name="name" minlength="3" maxlength="100" required><button class="button button-secondary">Criar organização</button></form></div>
<div id="manager-tools" hidden>
<dl class="stats"><div class="card"><dt>Ingressos pagos</dt><dd id="sold">0</dd></div><div class="card"><dt>Receita bruta</dt><dd id="gross">R$ 0,00</dd></div><div class="card"><dt>Após taxas confirmadas</dt><dd id="net">R$ 0,00</dd></div></dl>
<div class="card receiving"><div><h2>Recebimento</h2><p id="receiving-status" class="muted"></p><p id="commission-status" class="field-help"></p></div><div id="receiving-actions" class="button-group"></div></div>
<div class="dashboard-grid">
<section class="stack"><div class="section-heading"><h2>Evento</h2><button id="new-event" class="button button-secondary" type="button">Novo evento</button></div>
<form id="event-form" class="card stack"><input type="hidden" name="id">
<label for="event-name">Nome do evento</label><input id="event-name" name="name" required minlength="3" maxlength="120">
<label for="description">Descrição</label><textarea id="description" name="description" rows="3" maxlength="4000"></textarea>
<div class="form-grid"><div class="stack"><label for="starts-at">Início (UTC−03)</label><input id="starts-at" name="startsAt" type="datetime-local" required></div><div class="stack"><label for="ends-at">Fim (UTC−03)</label><input id="ends-at" name="endsAt" type="datetime-local" required></div></div>
<label for="place">Local e endereço</label><input id="place" name="place" minlength="3" maxlength="240" required>
<label for="capacity">Capacidade total</label><input id="capacity" name="capacity" type="number" min="1" max="1000000" step="1" required>
<label for="cover-url">Endereço da capa</label><input id="cover-url" name="coverUrl" value="/assets/atmosfera-invicta.webp" required>
<label for="refund-policy">Política de reembolso e contato do organizador</label><textarea id="refund-policy" name="refundPolicy" minlength="10" maxlength="2000" rows="3" required></textarea>
<button class="button" type="submit">Salvar evento</button></form>
</section>
<section class="stack"><h2>Lote</h2>
<form id="lot-form" class="card stack"><input type="hidden" name="id"><label for="event-select">Evento</label><select id="event-select" name="eventId" required></select>
<label for="lot-name">Nome do lote</label><input id="lot-name" name="name" minlength="2" maxlength="80" required>
<label for="category">Categoria</label><input id="category" name="category" minlength="2" maxlength="80" required>
<label for="lot-description">O que está incluído</label><textarea id="lot-description" name="description" maxlength="1000"></textarea>
<div class="form-grid"><div class="stack"><label for="price">Preço em reais</label><input id="price" name="price" type="number" min="0" max="100000" step="0.01" required></div><div class="stack"><label for="lot-capacity">Quantidade do lote</label><input id="lot-capacity" name="capacity" type="number" min="1" max="1000000" step="1" required></div></div>
<div class="form-grid"><div class="stack"><label for="sales-start">Venda a partir de (UTC−03)</label><input id="sales-start" name="salesStart" type="datetime-local" required></div><div class="stack"><label for="sales-end">Até (UTC−03)</label><input id="sales-end" name="salesEnd" type="datetime-local" required></div></div>
<label class="checkbox"><input name="closed" type="checkbox"> Encerrar este lote</label><button class="button" type="submit">Salvar lote</button><button id="new-lot" class="button button-secondary" type="button">Limpar formulário</button></form>
</section></div>
</div>
<section class="section"><h2>Eventos e lotes</h2><div id="event-list" class="stack"></div></section>
<section class="section" id="team-tools" hidden><h2>Equipe</h2><div id="team-list" class="stack"></div><form id="invite-form" class="card stack"><label for="invite-email">E-mail do convidado</label><input id="invite-email" name="email" type="email" required><label for="invite-role">Permissão</label><select id="invite-role" name="role"><option value="checkin">Portaria</option><option value="manager">Gestão de eventos</option></select><button class="button">Enviar convite</button></form></section>
<section class="section" id="refund-tools" hidden><h2>Reembolsos</h2><div id="refund-list" class="stack"></div></section>
</section></main></body></html>
