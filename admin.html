<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Invicta | Painel de demonstração</title>
    <link rel="stylesheet" href="styles.css">
    <script type="module" src="admin.js"></script>
</head>
<body>
    <a class="skip-link" href="#conteudo">Pular para o conteúdo</a>
    <header class="site-header">
        <div class="wrap topbar">
            <a class="brand" href="index.html"><span class="brand-mark" aria-hidden="true">I</span> INVICTA</a>
            <a class="button button-secondary button-small" href="index.html">Voltar ao site</a>
        </div>
    </header>
    <main id="conteudo" class="wrap section">
        <p class="eyebrow">Demonstração interna</p>
        <h1>Painel de eventos</h1>
        <p class="muted">Gerencie eventos e lotes de teste. Os dados ficam neste navegador.</p>
        <noscript><p class="notice">Ative o JavaScript para usar o painel de demonstração.</p></noscript>
        <p id="admin-status" class="notice" role="status"></p>
        <dl class="stats">
            <div class="card"><dt>Receita simulada</dt><dd id="revenue">R$ 0,00</dd></div>
            <div class="card"><dt>Ingressos emitidos</dt><dd id="sales">0</dd></div>
            <div class="card"><dt>Entradas registradas</dt><dd id="entries">0</dd></div>
        </dl>
        <div class="admin-forms">
            <form id="event-form" class="card stack">
                <h2>Criar evento</h2>
                <label for="event-name">Nome</label>
                <input id="event-name" name="name" required maxlength="80">
                <label for="starts-at">Data e hora local do evento</label>
                <input id="starts-at" name="date" type="datetime-local" required>
                <label for="place">Local</label>
                <input id="place" name="place" required maxlength="100">
                <label for="event-description">Descrição</label>
                <textarea id="event-description" name="description" rows="2" maxlength="220"></textarea>
                <button class="button" type="submit">Salvar evento de teste</button>
            </form>
            <form id="lot-form" class="card stack">
                <h2>Adicionar lote</h2>
                <label for="event-select">Evento</label>
                <select id="event-select" name="eventId" required></select>
                <label for="lot-name">Nome do lote</label>
                <input id="lot-name" name="name" placeholder="Ex. 1º lote" required maxlength="40">
                <label for="category">Categoria</label>
                <input id="category" name="category" placeholder="Ex. Público Geral" required maxlength="60">
                <div class="form-grid">
                    <div class="stack">
                        <label for="price">Preço em reais</label>
                        <input id="price" name="price" type="number" inputmode="decimal" min="0.01" max="100000" step="0.01" required>
                    </div>
                    <div class="stack">
                        <label for="capacity">Quantidade</label>
                        <input id="capacity" name="capacity" type="number" min="1" max="100000" step="1" required>
                    </div>
                </div>
                <label for="lot-description">O que está incluído</label>
                <textarea id="lot-description" name="description" rows="2" maxlength="180"></textarea>
                <button class="button" type="submit">Salvar lote de teste</button>
            </form>
        </div>

        <section class="section" aria-labelledby="catalog-title">
            <p class="eyebrow">Catálogo</p>
            <h2 id="catalog-title">Eventos e lotes</h2>
            <div id="admin-events" class="stack event-list"></div>
            <template id="event-row">
                <article class="card">
                    <div class="row-heading">
                        <div><h3></h3><p class="muted" data-event-meta></p></div>
                        <a class="button button-secondary button-small">Ver página do evento</a>
                    </div>
                    <ul class="lot-list"></ul>
                </article>
            </template>
            <template id="lot-row">
                <li class="row-heading">
                    <div><strong></strong><p class="muted"></p></div>
                    <button class="button button-secondary button-small" type="button"></button>
                </li>
            </template>
        </section>
    </main>
</body>
</html>
