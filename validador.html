<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Invicta | Validador de demonstração</title>
    <link rel="stylesheet" href="styles.css">
    <script type="module" src="validador.js"></script>
</head>
<body>
    <a class="skip-link" href="#conteudo">Pular para o conteúdo</a>
    <header class="site-header">
        <div class="wrap topbar">
            <a class="brand" href="index.html"><span class="brand-mark" aria-hidden="true">I</span> INVICTA</a>
            <a class="button button-secondary button-small" href="index.html">Voltar ao site</a>
        </div>
    </header>
    <main id="conteudo" class="wrap narrow section">
        <p class="eyebrow">Demonstração da portaria</p>
        <h1>Validar ingresso</h1>
        <p class="muted">Confira ingressos de teste emitidos neste navegador.</p>
        <noscript><p class="notice">Ative o JavaScript para usar o validador.</p></noscript>
        <div class="card stack validator-card">
            <form id="validation-form" class="stack">
                <label for="validation-event">Evento da portaria</label>
                <select id="validation-event" required></select>
                <label for="ticket-code">Código do ingresso</label>
                <input id="ticket-code" name="code" placeholder="INV-001" autocomplete="off" autocapitalize="characters" spellcheck="false" maxlength="100" required>
                <button class="button" type="submit">Validar código</button>
            </form>
            <button class="button button-secondary" id="camera-button" type="button">Abrir câmera</button>
            <video class="scanner-preview" id="scanner-preview" aria-label="Visualização da câmera" muted playsinline hidden></video>
            <p id="camera-status" class="notice" role="status"></p>
            <div id="validation-result" class="validation-result" role="status" aria-atomic="true" hidden>
                <strong id="result-title"></strong>
                <p id="result-details"></p>
            </div>
            <button id="next-ticket" class="button button-secondary" type="button" hidden>Próximo ingresso</button>
            <details>
                <summary>Códigos de exemplo</summary>
                <ul>
                    <li><code>INV-001</code> · ingresso válido para A Maior da UCB</li>
                    <li><code>INV-002</code> · ingresso já utilizado</li>
                    <li><code>INV-OUTRO</code> · ingresso da Calourada</li>
                </ul>
            </details>
        </div>
    </main>
</body>
</html>
